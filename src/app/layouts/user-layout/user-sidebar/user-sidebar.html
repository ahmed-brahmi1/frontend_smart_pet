<aside class="user-sidebar">
  <div class="sidebar-brand">
    <a [routerLink]="isAdmin ? '/admin/system-health' : '/dashboard'" class="brand-link">🐾 Smart Pet</a>
  </div>
  <nav class="sidebar-nav">
    @if (!isAdmin) {
      @for (item of menu; track item.link) {
        <a
          [routerLink]="item.link"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: item.link === '/dashboard' }"
          class="nav-item"
        >
          <span class="nav-icon">{{ item.icon }}</span>
          <span class="nav-label">{{ item.label }}</span>
        </a>
      }
    }
    @if (isAdmin) {
      @for (item of adminMenu; track item.link) {
        <a
          [routerLink]="item.link"
          routerLinkActive="active"
          class="nav-item"
        >
          <span class="nav-icon">{{ item.icon }}</span>
          <span class="nav-label">{{ item.label }}</span>
        </a>
      }
    }
  </nav>
  @if (currentUser; as user) {
    <div class="sidebar-footer">
      <span class="user-email">{{ user.email }}</span>
      <button type="button" class="btn-logout" (click)="auth.logout()">Logout</button>
    </div>
  }
</aside>
