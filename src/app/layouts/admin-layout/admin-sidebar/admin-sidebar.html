<aside class="admin-sidebar">
  <div class="sidebar-brand">
    <a routerLink="/admin/device-management" class="brand-link">⚙️ Admin</a>
    <a routerLink="/dashboard" class="back-link">← Back to app</a>
  </div>
  <nav class="sidebar-nav">
    @for (item of menu; track item.link) {
      <a
        [routerLink]="item.link"
        routerLinkActive="active"
        class="nav-item"
      >
        <span class="nav-icon">{{ item.icon }}</span>
        <span class="nav-label">{{ item.label }}</span>
      </a>
    }
  </nav>
  @if (currentUser; as user) {
    <div class="sidebar-footer">
      <span class="user-email">{{ user.email }}</span>
      <button type="button" class="btn-logout" (click)="auth.logout()">Logout</button>
    </div>
  }
</aside>
