<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Great+Vibes&display=swap" rel="stylesheet">
<div class="video-bg-container">
  <video autoplay muted loop playsinline class="bg-video">
    <source src="White.mp4" type="video/mp4">
  </video>
  <div class="video-overlay"></div>
</div>

<!-- Navbar ajoutée ici -->

<header class="navbar">

  <div class="logo"><span>Smart Pet</span></div>

  <nav>

    <a href="#">About</a>

    <a href="#">Features</a>

    <a href="#">FAQ</a>

    <button class="btn-primary" (click)="onFill()" >Get Started</button>

  </nav>

</header>

<main class="feeding-container">
  <div class="header-section">
    <h1 class="playfair">Feeding <span class="gold-text">Management</span></h1>
    <button class="btn-refill" (click)="onFill()" [disabled]="loading">
    <span class="refill-icon">✨</span> 
    {{ loading ? 'Refilling...' : 'Refill Station' }}
  </button>
    <p class="subtitle">Monitor your smart station levels in real-time</p>
  </div>

  <div class="levels-grid" *ngIf="status">
    <div class="glass-card">
      <div class="card-header">
        <span class="icon">💧</span>
        <h3>Water Level</h3>
      </div>
      <div class="gauge-container">
        <div class="gauge-fill water" [style.height.%]="status.waterLevel">
          <div class="wave"></div>
        </div>
        <span class="percentage">{{ status.waterLevel }}%</span>
      </div>
    </div>

    <div class="glass-card">
      <div class="card-header">
        <span class="icon">🦴</span>
        <h3>Food Level</h3>
      </div>
      <div class="gauge-container">
        <div class="gauge-fill food" [style.height.%]="status.foodLevel"></div>
        <span class="percentage">{{ status.foodLevel }}%</span>
      </div>
    </div>
  </div>

  <div class="loading" *ngIf="loading">
    <p>Connecting to station...</p>
  </div>
</main>
